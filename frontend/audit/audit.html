<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audit Logs | AMT Quotation</title>
  <link rel="stylesheet" href="/static/audit/audit.css">
  <link rel="stylesheet" href="/static/common/sidebar.css">
  <script src="/static/common/sidebar.js" defer></script>
  <script src="/static/audit/audit.js" defer></script>
</head>
<body>
  <header class="hdr"><div><div class="hdr-logo">Audit Logs</div><div class="hdr-sub">Account, lookup and business activity</div></div><nav><a class="back-link" href="/">Quotation Tool</a><a class="back-link" href="/logout">Sign Out</a></nav></header>
  <main class="audit-page">
    <section class="audit-card">
      <div class="audit-heading"><div><h1>Activity history</h1><p>Sign-ins, SKU lookups, PI searches, and changes to clients, orders and users.</p></div><button id="refreshAudit" type="button">Refresh</button></div>
      <form id="auditFilters" class="audit-filters">
        <label>Action<select id="filterAction"><option value="">All actions</option></select></label>
        <label>User<select id="filterUser"><option value="">All users</option></select></label>
        <label>Role<select id="filterRole"><option value="">All roles</option></select></label>
        <label>IP address<input id="filterIp" type="search" placeholder="Filter IP"></label>
        <label>From<input id="filterFrom" type="date"></label>
        <label>To<input id="filterTo" type="date"></label>
        <label class="audit-search">Search<input id="filterQuery" type="search" placeholder="Action, user, entity or details"></label>
        <div class="audit-filter-actions"><button type="submit" class="primary">Apply filters</button><button id="clearFilters" type="button">Clear</button></div>
      </form>
      <p id="auditStatus" role="status" aria-live="polite"></p>
      <div class="audit-table-wrap">
        <table>
          <thead><tr><th>Action</th><th>User</th><th>Role</th><th>Date</th><th>Time</th><th>IP address</th><th>Details</th></tr></thead>
          <tbody id="auditRows"><tr><td colspan="7">Loading activity…</td></tr></tbody>
        </table>
      </div>
      <footer class="audit-pagination"><span id="auditCount"></span><div><button id="auditPrev" type="button">Previous</button><span id="auditPage"></span><button id="auditNext" type="button">Next</button></div></footer>
    </section>
  </main>
</body>
</html>
