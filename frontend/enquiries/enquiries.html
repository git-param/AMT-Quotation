<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Enquiries | AMT</title><link rel="stylesheet" href="/static/manager_dashboard/manager.css"><link rel="stylesheet" href="/static/enquiry_sources/sources.css"><link rel="stylesheet" href="/static/enquiries/enquiries.css"></head><body>
<header class="hdr"><div><div class="hdr-logo">Client Enquiries</div><div class="hdr-sub">Track client requests</div></div><nav><span id="hdrUser"></span><a class="back-link" href="/leads">Client Leads</a><a class="back-link" href="/">Quotation Tool</a><a class="back-link" href="/logout">Sign Out</a></nav></header>
<main class="wrap"><p id="message" role="status" aria-live="polite"></p><div class="page-intro"><div><span class="eyebrow">ENQUIRIES</span><h1>Client requests, in one place</h1></div><button id="add" class="btn-sm btn-add">Add Enquiry</button></div>
<section class="panel source-editor" id="editor" hidden><div class="source-toolbar"><h2 id="formTitle">Create enquiry</h2><button class="btn-sm" id="cancel" type="button">Cancel</button></div><form id="form">
<div id="chooseClient"><label for="clientSearch">Find an authorized client</label><div class="picker"><input id="clientSearch" placeholder="Company, name, email or phone"><button class="btn-sm" id="findClient" type="button">Find clients</button><button class="btn-sm" id="clientPrev" type="button">Previous</button><button class="btn-sm" id="clientNext" type="button">Next</button><span id="clientPage"></span></div></div>
<div class="fields"><div class="form-field"><label for="client">Client</label><select id="client" required></select></div><div class="form-field"><label for="reference">Enquiry reference</label><input id="reference" required maxlength="80"></div><div class="form-field"><label for="enquiry_date">Enquiry date</label><input id="enquiry_date" type="date" required></div><div class="form-field"><label for="status">Status</label><select id="status"><option value="open">Open</option><option value="in_progress">In progress</option><option value="closed">Closed</option><option value="cancelled">Cancelled</option></select></div><div class="form-field wide"><label for="subject">Subject</label><input id="subject" required maxlength="200"></div><div class="form-field wide"><label for="description">Description</label><textarea id="description" maxlength="5000" rows="5"></textarea></div></div><button class="btn-sm btn-add" id="save" type="submit">Save enquiry</button></form></section>
<section class="panel" id="detail" hidden><div class="source-toolbar"><h2 id="detailTitle"></h2><button id="closeDetail" class="btn-sm">Close</button></div><div id="detailBody"></div></section>
<section class="panel"><form id="filters" class="picker"><input aria-label="Search enquiries" id="search" placeholder="Reference, subject or client" maxlength="200"><select aria-label="Filter by status" id="filterStatus"><option value="all">All statuses</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="closed">Closed</option><option value="cancelled">Cancelled</option></select><select aria-label="Sort enquiries" id="sort"><option value="date">Enquiry date</option><option value="created">Created</option><option value="reference">Reference</option><option value="status">Status</option></select><select aria-label="Sort direction" id="direction"><option value="desc">Descending</option><option value="asc">Ascending</option></select><button class="btn-sm btn-add">Search / Apply</button><a href="/enquiries">All accessible enquiries</a></form><p id="summary"></p><div class="source-table"><table class="tbl"><thead><tr><th>Reference</th><th>Client</th><th>Date</th><th>Subject</th><th>Status</th><th>Creator</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div class="picker"><button id="previous" class="btn-sm">Previous</button><span id="pageInfo"></span><button id="next" class="btn-sm">Next</button></div></section></main><script src="/static/enquiries/enquiries.js"></script></body></html>
