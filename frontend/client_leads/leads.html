<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Leads | AMT</title>
<link rel="stylesheet" href="/static/manager_dashboard/manager.css"><link rel="stylesheet" href="/static/enquiry_sources/sources.css"><link rel="stylesheet" href="/static/client_leads/leads.css"></head>
<body><header class="hdr"><div><div class="hdr-logo">Client Leads</div><div class="hdr-sub">Your client contacts</div></div><nav><span id="hdrUser"></span><a class="back-link" href="/">Quotation Tool</a><a class="back-link" href="/logout">Sign Out</a></nav></header>
<main class="wrap"><p id="message" role="status" aria-live="polite"></p><div id="content" hidden><div class="page-intro"><div><span class="eyebrow">CLIENT LEADS</span><h1>Start your next conversation</h1><p>Create a lead and keep the contact details in one place.</p></div></div>
<section class="panel source-editor"><div class="editor-heading"><div><h2>Add a client lead</h2><p>New leads are assigned to you automatically.</p></div></div><form id="leadForm"><div class="lead-fields">
<div class="form-field"><label for="name">Client name</label><input id="name" name="name" maxlength="150" required></div><div class="form-field"><label for="company">Company</label><input id="company" name="company" maxlength="150"></div><div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" maxlength="254"></div><div class="form-field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" maxlength="40"></div><div class="form-field lead-notes"><label for="notes">Notes</label><textarea id="notes" name="notes" maxlength="2000" rows="3"></textarea></div></div><button class="btn-sm btn-add" id="save" type="submit">Create lead</button></form></section>
<section class="panel"><div class="source-toolbar"><div><h2>Your accessible leads</h2><p id="summary"></p></div><button class="btn-sm" id="refresh">Refresh</button></div><div class="source-table"><table class="tbl"><thead><tr><th>Client</th><th>Company</th><th>Email</th><th>Phone</th><th>Created by</th><th>Created</th><th>Notes</th></tr></thead><tbody id="leads"></tbody></table></div></section></div></main><script src="/static/client_leads/leads.js"></script></body></html>
