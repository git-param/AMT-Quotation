<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Access | AMT</title>
<link rel="stylesheet" href="/static/manager_dashboard/manager.css">
<link rel="stylesheet" href="/static/client_access/access.css">
<link rel="stylesheet" href="/static/common/sidebar.css">
<script src="/static/common/sidebar.js" defer></script>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-mark" aria-hidden="true">🔗</div>
    <h1 class="hdr-logo">Client Access</h1>
  </div>
  <nav class="hdr-nav" aria-label="Main">
    <span class="hdr-user" id="hdrUser"></span>
    <a class="nav-link" href="/clients-orders">Clients &amp; Orders</a>
    <a class="nav-link" href="/">Quotation Tool</a>
    <a class="nav-link is-signout" href="/logout">Sign Out</a>
  </nav>
</header>

<main class="wrap access-wrap">
  <p id="message" role="status" aria-live="polite"></p>

  <div id="content" hidden>

    <section class="panel">
      <h2 class="panel-title">Grant access</h2>
      <form id="grantForm" class="access-bar">
        <div class="form-field f-owner">
          <label for="owner">User</label>
          <select id="owner"><option value="">All users</option></select>
        </div>
        <div class="form-field f-client">
          <label for="client">Client</label>
          <select id="client"></select>
        </div>
        <div class="form-field f-exec">
          <label for="executive">Sales executive</label>
          <select id="executive" required></select>
        </div>
        <div class="form-field f-level">
          <label for="accessLevel">Access</label>
          <select id="accessLevel">
            <option value="VIEW">VIEW – read only</option>
            <option value="EDIT">EDIT – view and update</option>
          </select>
        </div>
        <button class="btn-sm btn-add" id="grant" type="submit">Grant access</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Current access</h2>
        <button class="refresh-btn" id="refresh" type="button">↻ Refresh</button>
      </div>
      <div class="table-scroll is-flat">
        <table class="tbl">
          <thead><tr><th>Executive</th><th>Status</th><th>Access</th><th>Granted</th><th>Revoked</th><th>Action</th></tr></thead>
          <tbody id="shares"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 class="panel-title">History</h2></div>
      <div class="table-scroll is-flat">
        <table class="tbl">
          <thead><tr><th>Action</th><th>Executive</th><th>Change</th><th>By</th><th>When</th></tr></thead>
          <tbody id="events"></tbody>
        </table>
      </div>
    </section>

  </div>
</main>

<script src="/static/client_access/access.js"></script>
</body>
</html>
